project:
  name: shift-aware-risk-control
  mode: cifar10c_cache
  seed: 123

paths:
  data_root: data
  cache_dir: outputs/caches/cifar10c_subset

logging:
  level: INFO

cifar_c:
  dataset: cifar10c
  download: false
  model_backend: sklearn_logistic
  feature_mode: color_stats
  torch_batch_size: 128
  torch_device: auto
  torch_pretrained: true
  feature_cache_dir: null
  corruptions:
    - gaussian_noise
    - brightness
    - contrast
  severities:
    - 1
    - 3
    - 5
  max_examples_per_context: 1000
  train_subset_size: 10000
  random_seed: 123
