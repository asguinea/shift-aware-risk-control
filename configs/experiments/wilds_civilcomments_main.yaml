project:
  name: shift-aware-risk-control
  mode: wilds_experiment
  seed: 123

paths:
  output_root: outputs/runs
  run_name: wilds_civilcomments_main
  cache_dir: outputs/caches/wilds_civilcomments_subset

wilds_cache:
  build_if_missing: false
  overwrite_cache: false
  config_path: configs/wilds_civilcomments.yaml

windowing:
  window_size: 200
  stride: 200
  group_by_context: true
  sort_by: time_index
  drop_incomplete: true

signatures:
  include_label_diagnostics: true

encoder:
  method: pca
  n_components: 4
  whiten: false
  random_seed: 123

risk_control:
  score_column: confidence
  accept_if: greater_equal
  risk_budget: 0.10
  delta: 0.05
  bound: empirical_bernstein
  min_coverage: 0.0
  loss:
    loss_name: accepted_error
    deferral_cost: 0.0

splits:
  calibration_contexts: auto
  num_auto_calibration_contexts: 2
  evaluation_contexts: all

ct_crc:
  metric: euclidean
  l_hat: auto
  l_hat_quantile: 0.9
  epsilon_k: 0.0
  fallback_to_global: true

cw_crc:
  metric: euclidean
  kernel: gaussian
  bandwidth: null
  target_effective_sample_size: 8
  min_bandwidth: 1.0e-6
  max_bandwidth: null
  bandwidth_grid_size: 30
  example_weight_aggregation: mean
  finite_sample_correction: empirical_bernstein
  normalize_weights: true

outputs:
  save_intermediate: true
